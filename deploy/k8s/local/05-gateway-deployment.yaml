# The API/gateway process — same image as the CronJob, different command, so
# code.query is actually reachable locally and not just populated.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: commonindex-local
spec:
  replicas: 1
  selector:
    matchLabels: {app: gateway}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: commonindex:local
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
          env:
            - name: COMMONINDEX_DSN
              valueFrom: {secretKeyRef: {name: commonindex-secrets, key: COMMONINDEX_DSN}}
            - name: COMMONINDEX_SECRET_KEY
              valueFrom: {secretKeyRef: {name: commonindex-secrets, key: COMMONINDEX_SECRET_KEY}}
            - name: COMMONINDEX_ORIGINS
              valueFrom: {configMapKeyRef: {name: commonindex-config, key: COMMONINDEX_ORIGINS}}
          readinessProbe:
            httpGet: {path: /api/v1/_ops, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: commonindex-local
spec:
  selector: {app: gateway}
  ports: [{port: 8000, targetPort: 8000}]
  type: ClusterIP
