# The web app and the API on one origin. TLS is the job of whatever sits in
# front of this (a load balancer, Caddy, Traefik); docs/deploy.md.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Files, video uploads and imports go through the API.
    client_max_body_size 200m;

    # The gateway's own routes: the API, sign-in, and public share links.
    # Not /docs — that path is the app's Docs page, not the API's reference.
    location ~ ^/(api|auth|share)/ {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long enough for an AI answer from a slow model.
        proxy_read_timeout 900s;
        proxy_buffering off;
        include /etc/nginx/security-headers.conf;
    }

    # Pushed changes: one long-lived response per open tab, passed through as
    # it is written, with keep-alives every 20 seconds.
    location = /events {
        proxy_pass http://gateway:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        include /etc/nginx/security-headers.conf;
    }

    # Built files are named by their content: cache them for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Every other path is a page of the app.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri /index.html;
    }
}
